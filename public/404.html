<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Virtual Tutor</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages & static hosting
      // MIT License: https://github.com/rafgraph/spa-github-pages
      var l = window.location;

      // Do NOT rewrite missing static assets to index.html (return actual 404 behavior)
      if (l.pathname.startsWith('/assets/')) {
        document.title = '404 - Asset Not Found';
      } else {
        // Project pages under username.github.io/repo-name have 1 path segment to keep.
        // Custom domains (vartualtutor.com) or root domains have 0 path segments to keep.
        var isGitHubProjectPage = l.hostname.endsWith('github.io') && l.pathname.startsWith('/Virtual-Tutor-final');
        var pathSegmentsToKeep = isGitHubProjectPage ? 1 : 0;

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body style="background:#000;color:#fff;">
  </body>
</html>
